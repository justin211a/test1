<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      background: #f8f9fa;
    }
    h1 {
      font-size: 16px;
      color: #333;
      margin-bottom: 12px;
      text-align: center;
    }
    .config-section {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    #collectBtn {
      width: 100%;
      padding: 12px;
      background: #03c75a;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    #collectBtn:hover { background: #02a94d; }
    #collectBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .success { background: #d4edda; color: #155724; display: block !important; }
    .error { background: #f8d7da; color: #721c24; display: block !important; }
    .loading { background: #cce5ff; color: #004085; display: block !important; }
  </style>
</head>
<body>
  <h1>GFA DATA 수집</h1>

  <div class="config-section">
    <label>서버 URL</label>
    <input type="text" id="serverUrl" placeholder="https://your-cloud-run-url.run.app">
    <label>API Key</label>
    <input type="text" id="apiKey" placeholder="your-api-key">
  </div>

  <button id="collectBtn">데이터 수집 시작</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
