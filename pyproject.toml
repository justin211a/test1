[project]
name = "marketing-data-pipeline"
version = "0.1.0"
description = "Automated marketing data ETL pipeline for BigQuery (Meta, Google Ads, Naver SA, GFA)"
requires-python = ">=3.10"
dependencies = [
    "facebook-business>=20.0.0",
    "google-ads>=25.0.0",
    "google-cloud-bigquery>=3.20.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=15.0.0",
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
